<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Matte Obsidian Canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <!-- Warm Radiant Amber / Coral Gradient -->
    <linearGradient id="waveAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="waveDim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </linearGradient>

    <style>
      .label-mono {
        font-family: 'SF Mono', Monaco, Menlo, 'Fira Code', Consolas, monospace;
        font-size: 10px;
        letter-spacing: 2px;
        fill: #64748B;
        text-transform: uppercase;
      }
      .name-masthead {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 6px;
        fill: #F8FAFC;
        text-transform: uppercase;
      }
      .coordinate {
        font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
        font-size: 9.5px;
        letter-spacing: 1.5px;
        fill: #F97316;
      }
    </style>
  </defs>

  <!-- Canvas Container with Subtle Border -->
  <rect width="850" height="190" rx="8" fill="url(#bg)" stroke="#1F242F" stroke-width="1" />

  <!-- Top Masthead Info Bar -->
  <g transform="translate(42, 38)">
    <text x="0" y="0" class="name-masthead">PARTH KAUSHAL</text>
    <text x="0" y="20" class="label-mono">FULL-STACK &#8226; MACHINE LEARNING &#8226; WEB3</text>
  </g>

  <!-- Right Technical Spec Index -->
  <g transform="translate(808, 38)" text-anchor="end">
    <text x="0" y="0" class="coordinate">43°42'N 79°24'W</text>
    <text x="0" y="20" class="label-mono">CRAFT &#8226; COMPUTING &#8226; 2026</text>
  </g>

  <!-- Subtle Horizontal Guide Line -->
  <line x1="42" y1="72" x2="808" y2="72" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3" />

  <!-- Harmonic Waveforms (Topography / Signals / Loss Landscapes) -->
  <!-- Wave Layer 1 (Base Area Fill) -->
  <path d="M 42 160 Q 180 120, 320 145 T 600 130 T 808 140 L 808 175 L 42 175 Z" fill="url(#fadeBottom)" />

  <!-- Background Subtle Waves -->
  <path d="M 42 165 C 160 145, 260 115, 380 135 C 500 155, 640 125, 808 145" stroke="url(#waveDim)" stroke-width="1.2" fill="none" />
  <path d="M 42 152 C 180 125, 280 155, 430 130 C 580 105, 680 145, 808 132" stroke="url(#waveDim)" stroke-width="1.2" fill="none" />
  <path d="M 42 140 C 150 160, 310 110, 460 138 C 610 165, 710 115, 808 126" stroke="url(#waveDim)" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Hero Harmonic Wave (Vibrant Amber / Coral) -->
  <path d="M 42 148 C 170 105, 280 162, 420 122 C 560 82, 690 148, 808 118" stroke="url(#waveAccent)" stroke-width="2" fill="none" />

  <!-- Oscilloscope Reference Peaks & Nodes -->
  <circle cx="420" cy="122" r="4" fill="#0E1015" stroke="#F97316" stroke-width="2" />
  <circle cx="420" cy="122" r="1.5" fill="#FFFFFF" />
  
  <circle cx="600" cy="100" r="3" fill="#0E1015" stroke="#FBBF24" stroke-width="1.5" />
  <circle cx="600" cy="100" r="1" fill="#FFFFFF" />

  <!-- Frequency Grid Ticks Along Bottom Axis -->
  <g stroke="#334155" stroke-width="1" opacity="0.6">
    <line x1="100" y1="168" x2="100" y2="174" />
    <line x1="180" y1="168" x2="180" y2="174" />
    <line x1="260" y1="168" x2="260" y2="174" />
    <line x1="340" y1="168" x2="340" y2="174" />
    <line x1="420" y1="166" x2="420" y2="176" stroke="#F97316" />
    <line x1="500" y1="168" x2="500" y2="174" />
    <line x1="580" y1="168" x2="580" y2="174" />
    <line x1="660" y1="168" x2="660" y2="174" />
    <line x1="740" y1="168" x2="740" y2="174" />
  </g>
</svg>
